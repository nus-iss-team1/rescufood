AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  RescuFood notifications queue. Producers (profile, listings) send one
  message per notification to NotificationQueue; the notification
  service consumes it and sends the actual email. Deployed once per
  environment (dev, qa, prod) - no VPC dependency, so it can be deployed
  independently of the network/security/data stacks.

Parameters:
  ProjectName:
    Type: String
    Default: rescufood

  EnvironmentName:
    Type: String
    AllowedValues: [dev, qa, prod]
    Description: Environment this queue belongs to

  AlarmEmail:
    Type: String
    Default: ""
    Description: >-
      Address subscribed to notification delivery alarms. Leave empty to
      create the topic without a subscription and wire one up later.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  NotificationDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-${EnvironmentName}-notifications-dlq
      # Max allowed by SQS - gives time to notice and replay failures
      # before messages age out for good.
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-${EnvironmentName}-notifications
      # Long enough for a consumer to send the email and delete the message
      # before SQS makes it visible to another consumer again.
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDlq.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  NotificationAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ProjectName}-${EnvironmentName}-notification-alarms
      DisplayName: RescuFood notification delivery alarms
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  NotificationAlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref NotificationAlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # A message only lands here after maxReceiveCount delivery attempts, so
  # anything visible on the DLQ is a notification the service gave up on.
  NotificationDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${EnvironmentName}-notifications-dlq-not-empty
      AlarmDescription: >-
        One or more notifications exhausted their delivery attempts and were
        dead-lettered.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref NotificationAlarmTopic
      OKActions:
        - !Ref NotificationAlarmTopic

Outputs:
  NotificationQueueUrl:
    Value: !Ref NotificationQueue
    Export:
      Name: !Sub ${AWS::StackName}-QueueUrl

  NotificationQueueArn:
    Value: !GetAtt NotificationQueue.Arn
    Export:
      Name: !Sub ${AWS::StackName}-QueueArn

  NotificationDlqArn:
    Value: !GetAtt NotificationDlq.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DlqArn

  NotificationAlarmTopicArn:
    Value: !Ref NotificationAlarmTopic
    Export:
      Name: !Sub ${AWS::StackName}-AlarmTopicArn
