version: 2

# Monthly, one grouped pull request per ecosystem. Major bumps are
# ignored: eslint 10 landed unreviewed and broke the platform lint, and
# majors are the ones that need a person. Raise them by hand.
#
# Dependabot alerts and the trivy scan still report advisories that need
# a major bump, since ignoring one silences its security pull request.
updates:
  - package-ecosystem: npm
    directories:
      - /web/platform
      - /web/admin-console
      - /web/sdk
      - /web/ui
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /service/profile
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci(deps)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /web/platform
      - /service/profile
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 1
    commit-message:
      prefix: build(deps)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        patterns: ["*"]
