name: Profile CI

on:
  pull_request:
    branches: [develop]
    paths:
      - "service/profile/**"
      - ".github/workflows/profile-ci.yml"
      - ".github/workflows/reusable-security-scans.yml"
  workflow_dispatch:

concurrency:
  group: profile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vet & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: service/profile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: service/profile/go.mod
          cache-dependency-path: service/profile/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration test
    # Gated on `test`: skip the DB spin-up if vet/unit already failed.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: service/profile

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: profile
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: service/profile/go.mod
          cache-dependency-path: service/profile/go.sum

      - name: Vet
        run: go vet -tags=integration ./integration/...

      # Runs the unit + integration tests against the Postgres service
      # container (provided via DATABASE_URL) and writes a coverage table to
      # the job summary, then fails if coverage is below COVERAGE_MIN (80%).
      - name: Test & coverage
        # postgres:// (not postgresql://) so runMigrations' scheme rewrite to
        # pgx5:// fires; pgxpool accepts this form too.
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/profile?sslmode=disable
        run: bash scripts/coverage.sh

  security:
    name: Security scans
    uses: ./.github/workflows/reusable-security-scans.yml
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      component: profile
      working-directory: service/profile
      codeql-languages: '["go"]'
      # Go is compiled: CodeQL builds the module to analyse it.
      codeql-build-mode: autobuild
      semgrep-configs: p/default p/secrets p/golang
      # Flip to true once the existing findings are triaged.
      fail-on-findings: false

  # Always runs so branch protection has a check that reports even when the
  # path filter skips everything above. Required on develop.
  checks:
    name: Profile checks
    if: always()
    needs: [test, integration, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything above failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream: $results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
