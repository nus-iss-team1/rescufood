name: End-to-End Tests

# Runs after a platform deploy finishes, or on demand. This is a post-deploy
# smoke check, not a gate: it never blocks the build/deploy workflow (it only
# starts once that workflow has already finished) and it is not wired into
# any branch-protection required check. A failure here should show up red in
# the Actions tab and in the uploaded report - not be silently masked - so
# don't add continue-on-error to the test step.
#
# dev and qa only. The suite posts listings, claims them and completes
# pickups, so running it against prod would write test data into the live
# site.
on:
  workflow_run:
    workflows: ["Build & Push Platform Image"]
    types: [completed]
  workflow_dispatch: {}

# One run per environment. Two overlapping runs against the same environment
# would share its TEST_DONOR_*/TEST_RESCUE_PARTNER_* accounts and can interfere
# with each other (see e2e/README.md) - extra runs queue rather than run in
# parallel. Each environment has its own Cognito pool, so dev and qa runs are
# independent and grouped separately.
concurrency:
  group: e2e-test-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright E2E
    if: >-
      (github.event_name == 'workflow_dispatch'
        || github.event.workflow_run.conclusion == 'success')
      && (github.event.workflow_run.head_branch || github.ref_name) != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'qa' && 'qa' || 'dev' }}
    defaults:
      run:
        working-directory: e2e

    steps:
      # Test the commit that was deployed, not the default branch - a qa
      # deploy must run qa's tests.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      # Only the platform build triggers this workflow, so a commit touching
      # several services can leave the others mid-rollout while the suite
      # runs against them.
      - name: Wait for the environment to settle
        working-directory: .
        env:
          CLUSTER: rescufood-${{ (github.event.workflow_run.head_branch || github.ref_name) == 'qa' && 'qa' || 'dev' }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            rolling=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services web-platform profile listings notification \
              --query "length(services[?deployments[?status=='PRIMARY' && rolloutState!='COMPLETED']])" \
              --output text)
            if [ "$rolling" = "0" ]; then
              echo "all services stable"
              exit 0
            fi
            echo "$rolling service(s) still rolling"
            sleep 10
          done
          echo "::error::$CLUSTER did not settle within 10 minutes"
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        env:
          # Base URL of the environment under test, from that environment's
          # Actions variables (Settings > Environments > <name> > Variables).
          # Required - the run fails fast if it is unset.
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_DONOR_USERNAME: ${{ secrets.TEST_DONOR_USERNAME }}
          TEST_DONOR_PASSWORD: ${{ secrets.TEST_DONOR_PASSWORD }}
          TEST_RESCUE_PARTNER_USERNAME: ${{ secrets.TEST_RESCUE_PARTNER_USERNAME }}
          TEST_RESCUE_PARTNER_PASSWORD: ${{ secrets.TEST_RESCUE_PARTNER_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Note failure in job summary
        if: failure()
        run: |
          echo "### :x: End-to-end tests failed" >> "$GITHUB_STEP_SUMMARY"
          echo "This is a post-deploy smoke check and does not block anything. Download the **playwright-report** artifact above for the trace and screenshots." >> "$GITHUB_STEP_SUMMARY"
