# Publishes one shields.io endpoint per backend service to the `badges`
# branch, which the README reads. Runs after a merge to develop, so a badge
# always reflects develop rather than whatever a pull request happened to do.
#
# One job per service, each mirroring that service's own integration job:
# its own Postgres, its own database name, its own DATABASE_URL. They must
# not share a database - listings applies profile's migrations, so a shared
# one fails on the second service to run.
name: Coverage badges

on:
  push:
    branches: [develop]
    paths:
      - "service/**"
      - ".github/workflows/coverage-badges.yml"
  workflow_dispatch: {}

concurrency:
  group: coverage-badges
  cancel-in-progress: false

jobs:
  profile:
    name: Profile coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service/profile
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: profile
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: service/profile/go.mod
          cache-dependency-path: service/profile/go.sum
      - name: Coverage
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/profile?sslmode=disable
        run: bash scripts/coverage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pct-profile
          path: service/profile/coverage-pct.txt

  listings:
    name: Listings coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service/listings
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: profile
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service/listings/package-lock.json
      - run: npm ci
      - name: Coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/profile?sslmode=disable
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: pct-listings
          path: service/listings/coverage-pct.txt

  notifications:
    name: Notifications coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: service/notifications
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: notifications
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service/notifications/package-lock.json
      - run: npm ci
      - name: Coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notifications?sslmode=disable
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: pct-notifications
          path: service/notifications/coverage-pct.txt

  publish:
    name: Publish badges
    needs: [profile, listings, notifications]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: pct
          pattern: pct-*

      - name: Build badge endpoints
        run: |
          mkdir -p badge-out
          for svc in profile listings notifications; do
            pct=$(cat "pct/pct-$svc/coverage-pct.txt")
            colour=$(awk -v p="$pct" 'BEGIN {
              if (p < 50)      print "red"
              else if (p < 70) print "orange"
              else if (p < 80) print "yellow"
              else if (p < 90) print "green"
              else             print "brightgreen"
            }')
            printf '{"schemaVersion":1,"label":"%s coverage","message":"%s%%","color":"%s"}\n' \
              "$svc" "$pct" "$colour" > "badge-out/$svc.json"
          done
          cat badge-out/*.json

      - name: Publish to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges --depth=1 || true
          if git show-ref --quiet refs/remotes/origin/badges; then
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          find . -maxdepth 1 ! -name . ! -name .git ! -name badge-out ! -name pct -exec rm -rf {} +
          mv badge-out/*.json .
          rm -rf badge-out pct
          git add -A
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore(badges): refresh coverage from ${GITHUB_SHA::7}"
          git push origin badges
