name: Notifications CI

on:
  # Every PR, so the required `checks` job always reports. Whether the jobs
  # below run is decided by `changes`, not by a trigger path filter.
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: notifications-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The PR merge commit and its first parent, the base branch.
          fetch-depth: 2

      - name: Diff against the base branch
        id: diff
        env:
          PATHS: >-
            service/notifications/
            .github/workflows/notifications-ci.yml
            .github/workflows/reusable-security-scans.yml
        # Manual runs have no base to compare with, so they run everything;
        # so does any git error, since only a clean "no diff" skips.
        run: |
          read -ra paths <<< "$PATHS"
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && git diff --quiet HEAD^1 HEAD -- "${paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Lint, test & build
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: service/notifications

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service/notifications/package-lock.json

      - name: Install
        run: npm ci

      # eslint directly, not the package script: that one adds --fix, which
      # rewrites files instead of reporting on them.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build

  integration:
    name: Integration test
    # Gated on `test`: skip the DB spin-up if lint/unit/build already failed.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: service/notifications

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: notifications
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service/notifications/package-lock.json

      - name: Install
        run: npm ci

      # Runs the unit + integration suites against the Postgres service
      # container (provided via DATABASE_URL) and writes a merged coverage
      # table to the job summary. Fails on a test failure, or if coverage is
      # below COVERAGE_MIN (80%).
      - name: Test & coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notifications?sslmode=disable
        run: npm run test:coverage

  security:
    name: Security scans
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/reusable-security-scans.yml
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      component: notifications
      working-directory: service/notifications
      codeql-languages: '["javascript-typescript"]'
      semgrep-configs: p/default p/secrets p/nodejs
      # Blocks on Semgrep ERROR and Trivy CRITICAL (fixable only); the rest is
      # reported to code scanning without blocking.
      fail-on-findings: true

  # Always runs so branch protection has a check that reports even when
  # `changes` skips everything above. Required on develop. Skipped jobs
  # pass; `changes` is listed so a failure there can't pass as a skip.
  checks:
    name: Notifications checks
    if: always()
    needs: [changes, test, integration, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything above failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream: $results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
