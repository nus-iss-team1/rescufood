name: QA End-to-End Tests

# Runs after a platform deploy finishes, or on demand. This is a post-deploy
# smoke check, not a gate: it never blocks the build/deploy workflow (it only
# starts once that workflow has already finished) and it is not wired into
# any branch-protection required check. A failure here should show up red in
# the Actions tab and in the uploaded report - not be silently masked - so
# don't add continue-on-error to the test step.
on:
  workflow_run:
    workflows: ["Build & Push Platform Image"]
    types: [completed]
  workflow_dispatch: {}

# Only one e2e run at a time. Two overlapping runs would share the same
# TEST_DONOR_*/TEST_RESCUE_PARTNER_* accounts and can interfere with each
# other (see qa/README.md) - extra runs queue rather than run in parallel.
concurrency:
  group: qa-test
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright E2E
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: qa

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        env:
          # Matches the default dev ALB already used locally in playwright.config.ts.
          BASE_URL: http://rescufood-dev-alb-1968524694.ap-southeast-1.elb.amazonaws.com
          TEST_DONOR_USERNAME: ${{ secrets.TEST_DONOR_USERNAME }}
          TEST_DONOR_PASSWORD: ${{ secrets.TEST_DONOR_PASSWORD }}
          TEST_RESCUE_PARTNER_USERNAME: ${{ secrets.TEST_RESCUE_PARTNER_USERNAME }}
          TEST_RESCUE_PARTNER_PASSWORD: ${{ secrets.TEST_RESCUE_PARTNER_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa/playwright-report/
          retention-days: 14

      - name: Note failure in job summary
        if: failure()
        run: |
          echo "### :x: QA e2e tests failed" >> "$GITHUB_STEP_SUMMARY"
          echo "This is a post-deploy smoke check and does not block anything. Download the **playwright-report** artifact above for the trace and screenshots." >> "$GITHUB_STEP_SUMMARY"
