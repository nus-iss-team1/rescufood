name: Listings CI

on:
  pull_request:
    branches: [develop]
    paths:
      - "service/listings/**"
      # The integration suite applies these too.
      - "service/profile/db/migrations/**"
      - ".github/workflows/listings-ci.yml"
      - ".github/workflows/reusable-security-scans.yml"
  workflow_dispatch:

concurrency:
  group: listings-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: service/listings

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service/listings/package-lock.json

      - name: Install
        run: npm ci

      # eslint directly, not the package script: that one adds --fix, which
      # rewrites files instead of reporting on them.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build

  security:
    name: Security scans
    uses: ./.github/workflows/reusable-security-scans.yml
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      component: listings
      working-directory: service/listings
      codeql-languages: '["javascript-typescript"]'
      semgrep-configs: p/default p/secrets p/nodejs
      # Flip to true once the existing findings are triaged.
      fail-on-findings: false

  integration:
    name: Integration test
    # Gated on `test`: skip the DB spin-up if lint/unit/build already failed.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: service/listings

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: profile
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service/listings/package-lock.json

      - name: Install
        run: npm ci

      # Runs the unit + integration suites against the Postgres service
      # container (provided via DATABASE_URL; listings applies profile's
      # migrations into the shared `profile` DB) and writes a merged coverage
      # table to the job summary. Fails on a test failure, or if coverage is
      # below COVERAGE_MIN (80%).
      - name: Test & coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/profile?sslmode=disable
        run: npm run test:coverage

  # Always runs so branch protection has a check that reports even when the
  # path filter skips everything above. Required on develop.
  checks:
    name: Listings checks
    if: always()
    needs: [test, integration, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything above failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream: $results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
