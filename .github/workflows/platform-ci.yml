name: Platform CI

on:
  # Every PR, so the required `checks` job always reports. Whether the jobs
  # below run is decided by `changes`, not by a trigger path filter.
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      scan-type:
        description: ZAP scan type. Active attacks run only on request.
        required: false
        default: baseline
        type: choice
        options: [baseline, full]

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The PR merge commit and its first parent, the base branch.
          fetch-depth: 2

      - name: Diff against the base branch
        id: diff
        env:
          PATHS: >-
            web/platform/
            web/sdk/
            web/ui/
            .github/workflows/platform-ci.yml
            .github/workflows/reusable-security-scans.yml
            .github/workflows/reusable-dast.yml
            .github/zap/
        # Manual runs have no base to compare with, so they run everything;
        # so does any git error, since only a clean "no diff" skips.
        run: |
          read -ra paths <<< "$PATHS"
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && git diff --quiet HEAD^1 HEAD -- "${paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Lint, type-check & unit test
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web/platform

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/platform/package-lock.json
            web/ui/package-lock.json

      # The linked ui package resolves its own runtime deps from web/ui,
      # since it's a file: dependency, not an npm workspace (see
      # web/platform/Dockerfile).
      - name: Install ui dependencies
        working-directory: web/ui
        run: npm ci --omit=dev

      - name: Install platform dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # Fails below the 80% statement threshold in vitest.config.mts, which
      # counts server actions and lib only.
      - name: Unit test & coverage
        run: npm run test:coverage

  security:
    name: Security scans
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/reusable-security-scans.yml
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      component: platform
      # Semgrep and trivy cover every web package; codeql analyses the
      # app alone because the wider tree makes one query hang.
      working-directory: web
      codeql-paths: web/platform
      codeql-languages: '["javascript-typescript"]'
      # Blocks on Semgrep ERROR and Trivy CRITICAL (fixable only); the rest is
      # reported to code scanning without blocking.
      fail-on-findings: true

  dast:
    name: DAST
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/reusable-dast.yml
    permissions:
      contents: read
    with:
      component: platform
      build-context: web
      dockerfile: web/platform/Dockerfile
      port: 3000
      health-path: /
      scan-path: /
      # Empty on pull requests, where only the passive scan makes sense.
      scan-type: ${{ inputs.scan-type || 'baseline' }}
      # Blocks on alerts marked FAIL in .github/zap/rules.tsv.
      fail-on-findings: true
      # Cognito variables are left unset, so the app renders sign-in as disabled.
      runtime-env: |
        AUTH_SECRET=dast-throwaway-secret-not-used-outside-ci
        AUTH_URL=http://localhost:3000
        AUTH_TRUST_HOST=true
        NEXT_TELEMETRY_DISABLED=1

  # Always runs so branch protection has a check that reports even when
  # `changes` skips everything above. Skipped jobs pass; `changes` is listed
  # so a failure there can't pass as a skip.
  checks:
    name: Platform checks
    if: always()
    needs: [changes, quality, security, dast]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything above failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream: $results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
